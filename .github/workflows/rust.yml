name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build all game versions
      shell: pwsh
      run: |
        rustup target add x86_64-pc-windows-gnu
        ./build-all.ps1

    # The artifact is the FOMOD archive: fomod/ + one folder per game version.
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: dist
